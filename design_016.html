<!-- Design: Holographic Foil | Unique approach: rainbow metallic sheen that shifts with mouse angle -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holographic Foil</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Orbitron',sans-serif;background:#0a0a0a;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .title{font-size:4rem;font-weight:900;background:linear-gradient(90deg,#ff0080,#ff8c00,#40e0d0,#ff0080);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shift 4s ease infinite;text-align:center;z-index:2;position:relative}
  .subtitle{font-size:1rem;color:rgba(255,255,255,.6);margin-top:20px;z-index:2;position:relative;letter-spacing:.3em}
  canvas{position:absolute;inset:0;z-index:1}
  @keyframes shift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">HOLOGRAPHIC</div>
<div class="subtitle">move your cursor</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h,mouse={x:.5,y:.5};
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
  resize();addEventListener('resize',resize);
  addEventListener('mousemove',e=>{mouse.x=e.clientX/w;mouse.y=e.clientY/h});
  function draw(){
    ctx.fillStyle='rgba(10,10,10,.1)';ctx.fillRect(0,0,w,h);
    for(let i=0;i<5;i++){
      const x=w/2+Math.sin(Date.now()*.001+i)*200*(mouse.x-.5);
      const y=h/2+Math.cos(Date.now()*.0015+i)*150*(mouse.y-.5);
      const r=50+Math.sin(Date.now()*.002+i)*30;
      const grad=ctx.createRadialGradient(x,y,0,x,y,r);
      const hue=(Date.now()*.05+i*60)%360;
      grad.addColorStop(0,`hsla(${hue},100%,70%,.3)`);
      grad.addColorStop(1,`hsla(${hue},100%,50%,0)`);
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
