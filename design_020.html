<!-- Design: Pixel Art Scene | Unique approach: 8-bit landscape with click scene change -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Art Scene</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Press Start 2P',cursive;background:#202028;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
  canvas{display:block;image-rendering:pixelated;box-shadow:0 0 40px rgba(0,0,0,.5);border:4px solid #444}
  .title{margin-top:20px;font-size:1rem;color:#8bac0f;z-index:2;text-shadow:2px 2px 0 #306230}
  .hint{margin-top:10px;font-size:.6rem;color:#8bac0f;opacity:.6;z-index:2}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('$id')">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<canvas id="c" width="320" height="240"></canvas>
<div class="title">PIXEL WORLD</div>
<div class="hint">click to change scene</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  const W=320,H=240;
  let scene=0;
  canvas.addEventListener('click',()=>scene=(scene+1)%3);
  const palettes=[
    {sky:'#88c070',mount:'#306230',ground:'#8bac0f',tree:'#0f380f',sun:'#e0f8d0'},
    {sky:'#2c2c7c',mount:'#000088',ground:'#585858',tree:'#f8f8f8',moon:'#f8f8f8'},
    {sky:'#d92828',mount:'#a02020',ground:'#e8a060',tree:'#602000',sun:'#f8d878'}
  ];
  function drawPixelRect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.floor(x),Math.floor(y),w,h)}
  function drawScene(){
    const p=palettes[scene];
    // Sky
    drawPixelRect(0,0,W,H,p.sky);
    // Celestial body
    if(scene===0){drawPixelRect(250,30,30,30,p.sun)}
    else if(scene===1){drawPixelRect(250,30,30,30,p.moon)}
    else{drawPixelRect(120,40,50,50,p.sun)}
    // Mountains
    for(let i=0;i<W;i+=4){
      const mh=60+Math.sin(i*.02)*20;
      drawPixelRect(i,H-mh,4,mh,p.mount);
    }
    // Ground
    drawPixelRect(0,H-40,W,40,p.ground);
    // Trees
    for(let i=20;i<W;i+=40){
      drawPixelRect(i,H-60,12,20,p.tree);
      drawPixelRect(i+2,H-80,8,20,p.tree);
    }
    // Text
    ctx.fillStyle='#fff';ctx.font='10px "Press Start 2P"';ctx.fillText('SCENE '+(scene+1),10,20);
  }
  function loop(){drawScene();requestAnimationFrame(loop)}
  loop();
</script>
<script>
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes('$id')){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
