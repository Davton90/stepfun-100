<!-- Design: Poster Typography | Unique approach: oversized text cropped with hover reveal -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster Typography</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Anton',sans-serif;background:#000;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}
  .container{position:relative;width:100%;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .big-text{font-size:18vw;color:#fff;position:absolute;white-space:nowrap;letter-spacing:-.05em;line-height:.8;clip-path:inset(0 0 50% 0);transition:clip-path .8s cubic-bezier(.77,0,.175,1)}
  .container:hover .big-text{clip-path:inset(0 0 0 0)}
  .big-text:nth-child(1){top:15%;left:-5%;color:#ff0080}
  .big-text:nth-child(2){top:45%;left:-10%;color:#00ffff}
  .big-text:nth-child(3){top:75%;left:-5%;color:#ffff00}
  .subtitle{position:absolute;bottom:50px;font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:#fff;letter-spacing:.5em;z-index:2;opacity:0;transition:opacity .5s .3s}
  .container:hover .subtitle{opacity:1}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
</style>
</head>
<body><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<div class="container">
  <div class="big-text">BOLD</div>
  <div class="big-text">IMPACT</div>
  <div class="big-text">POSTER</div>
  <div class="subtitle">HOVER TO REVEAL</div>
</div>
</body>
</html>
