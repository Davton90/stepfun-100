<!-- Design: Aurora Borealis Sky | Unique approach: flowing curtain-like aurora bands with mouse shift -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Borealis Sky</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Montserrat',sans-serif;background:#0a0e27;overflow:hidden;height:100vh;color:#fff}
  canvas{display:block;position:absolute;inset:0}
  .title{position:absolute;bottom:50px;width:100%;text-align:center;font-size:2.5rem;font-weight:200;z-index:2;letter-spacing:.5em;text-shadow:0 0 30px rgba(100,200,255,.6)}
  .subtitle{position:absolute;bottom:20px;width:100%;text-align:center;font-size:.8rem;z-index:2;opacity:.5;letter-spacing:.3em;text-transform:uppercase}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('$id')">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<canvas id="c"></canvas>
<div class="title">AURORA</div>
<div class="subtitle">move mouse to shift sky</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h,mouse={x:.5,y:.5};
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
  resize();addEventListener('resize',resize);
  addEventListener('mousemove',e=>{mouse.x=e.clientX/w;mouse.y=e.clientY/h});
  function draw(){
    ctx.fillStyle='#0a0e27';ctx.fillRect(0,0,w,h);
    for(let band=0;band<5;band++){
      ctx.beginPath();
      const baseY=h*(.2+band*.12);
      const hue=120+band*40+Math.sin(Date.now()*.0005)*30;
      for(let x=0;x<=w;x+=5){
        const y=baseY+Math.sin(x*.003+Date.now()*.001+band)*50+Math.sin(x*.01+Date.now()*.002)*20+(mouse.y-.5)*100;
        x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      for(let x=w;x>=0;x-=5){
        const y=baseY+60+Math.sin(x*.003+Date.now()*.001+band+1)*40+(mouse.y-.5)*80;
        ctx.lineTo(x,y);
      }
      ctx.closePath();
      const grad=ctx.createLinearGradient(0,baseY-50,0,baseY+100);
      grad.addColorStop(0,`hsla(${hue},80%,50%,0)`);
      grad.addColorStop(.5,`hsla(${hue},80%,50%,.15)`);
      grad.addColorStop(1,`hsla(${hue},80%,50%,0)`);
      ctx.fillStyle=grad;ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
</script>
<script>
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes('$id')){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
