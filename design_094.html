<!-- Design: Japanese Zen Minimal | Unique approach: white/indigo rice paper with single brush stroke -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Zen Minimal</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Serif JP',serif;background:#f5f0e8;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}
  canvas{display:block;position:absolute;inset:0}
  .title{position:absolute;top:30px;width:100%;text-align:center;font-size:1.5rem;font-weight:200;z-index:2;color:#333;letter-spacing:.5em}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('094')" style="position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<canvas id="c"></canvas>
<div class="title">ç¦… â€” ZEN</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h;
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight;draw()}
  resize();addEventListener('resize',resize);
  addEventListener('click',draw);
  function draw(){
    ctx.fillStyle='#f5f0e8';ctx.fillRect(0,0,w,h);
    // Rice paper texture
    ctx.globalAlpha=.03;
    for(let i=0;i<1000;i++){ctx.fillStyle='#000';ctx.fillRect(Math.random()*w,Math.random()*h,1,1)}
    ctx.globalAlpha=1;
    // Single brush stroke
    ctx.strokeStyle='#1a1a1a';ctx.lineWidth=8;ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(w/2-100,h/2+50);
    ctx.bezierCurveTo(w/2-50,h/2,w/2+50,h/2-50,w/2+100,h/2-80);
    ctx.stroke();
    // Ink blob
    ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(w/2+100,h/2-80,12,0,Math.PI*2);ctx.fill();
    // Red seal
    ctx.fillStyle='#c41e3a';ctx.font='bold 24px serif';ctx.fillText('ç¦…',w/2+140,h/2-60);
  }
  draw();
</script>

<script>
  window.toggleFavorite=function(id){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function setFavs(favs){try{localStorage.setItem(FAVORITES_KEY,JSON.stringify(favs))}catch(e){return}}
    let favs=getFavs();
    if(favs.includes(id)){favs=favs.filter(f=>f!==id);btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}
    else{favs.push(id);btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}
    setFavs(favs);
    window.dispatchEvent(new StorageEvent('storage',{key:FAVORITES_KEY}));
  };
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    const id='094';
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes(id)){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
