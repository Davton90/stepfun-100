<!-- Design: Japanese Zen Minimal | Unique approach: white/indigo rice paper with single brush stroke -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Zen Minimal</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Serif JP',serif;background:#f5f0e8;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}
  canvas{display:block;position:absolute;inset:0}
  .title{position:absolute;top:30px;width:100%;text-align:center;font-size:1.5rem;font-weight:200;z-index:2;color:#333;letter-spacing:.5em}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
</style>
</head>
<body><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<canvas id="c"></canvas>
<div class="title">ç¦… â€” ZEN</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h;
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight;draw()}
  resize();addEventListener('resize',resize);
  addEventListener('click',draw);
  function draw(){
    ctx.fillStyle='#f5f0e8';ctx.fillRect(0,0,w,h);
    // Rice paper texture
    ctx.globalAlpha=.03;
    for(let i=0;i<1000;i++){ctx.fillStyle='#000';ctx.fillRect(Math.random()*w,Math.random()*h,1,1)}
    ctx.globalAlpha=1;
    // Single brush stroke
    ctx.strokeStyle='#1a1a1a';ctx.lineWidth=8;ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(w/2-100,h/2+50);
    ctx.bezierCurveTo(w/2-50,h/2,w/2+50,h/2-50,w/2+100,h/2-80);
    ctx.stroke();
    // Ink blob
    ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(w/2+100,h/2-80,12,0,Math.PI*2);ctx.fill();
    // Red seal
    ctx.fillStyle='#c41e3a';ctx.font='bold 24px serif';ctx.fillText('ç¦…',w/2+140,h/2-60);
  }
  draw();
</script>
</body>
</html>
