<!-- Design: Fauvist Wild Garden | Unique approach: wild non-natural colors and chaotic flower growth -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fauvist Wild Garden</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Bangers',cursive;background:#ff00ff;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
  canvas{display:block;position:absolute;inset:0}
  .title{position:absolute;top:30px;width:100%;text-align:center;font-size:2.5rem;z-index:2;color:#00ffff;text-shadow:3px 3px 0 #ff0000;transform:rotate(3deg)}
  .hint{position:absolute;bottom:30px;font-size:1rem;z-index:2;color:#ffff00;background:#000;padding:5px 20px;border:3px solid #00ffff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">WILD GARDEN</div>
<div class="hint">CLICK TO PLANT</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h;
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
  resize();addEventListener('resize',resize);
  addEventListener('click',e=>flowers.push(new Flower(e.clientX,e.clientY)));
  const colors=['#ff0000','#00ff00','#0000ff','#ffff00','#ff00ff','#00ffff','#ff8800'];
  class Flower{
    constructor(x,y){this.x=x;this.y=y;this.size=0;this.targetSize=20+Math.random()*40;this.petals=5+Math.floor(Math.random()*5);this.color=colors[Math.floor(Math.random()*colors.length)];this.rot=Math.random()*Math.PI*2}
    update(){this.size+=(this.targetSize-this.size)*.05;this.rot+=.01}
    draw(){
      ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);
      for(let i=0;i<this.petals;i++){
        const a=(i/this.petals)*Math.PI*2;
        ctx.fillStyle=this.color;ctx.beginPath();
        ctx.ellipse(Math.cos(a)*this.size*.4,Math.sin(a)*this.size*.4,this.size*.4,this.size*.15,a,0,Math.PI*2);ctx.fill();
      }
      ctx.fillStyle='#ffff00';ctx.beginPath();ctx.arc(0,0,this.size*.2,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  }
  let flowers=Array.from({length:15},()=>new Flower(Math.random()*w,Math.random()*h));
  flowers.forEach(f=>f.size=f.targetSize);
  function loop(){
    ctx.fillStyle='rgba(255,0,255,.08)';ctx.fillRect(0,0,w,h);
    flowers.forEach(f=>{f.update();f.draw()});
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
