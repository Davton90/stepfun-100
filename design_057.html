<!-- Design: Suprematist Composition | Unique approach: floating black/red/white geometric shapes -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suprematist Composition</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#f0f0f0;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}
  canvas{display:block;position:absolute;inset:0}
  .title{position:absolute;top:30px;width:100%;text-align:center;font-size:2rem;font-weight:900;z-index:2;letter-spacing:.5em;color:#000;mix-blend-mode:difference}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
</style>
</head>
<body><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<canvas id="c"></canvas>
<div class="title">SUPREMATISM</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h;
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight;generate()}
  resize();addEventListener('resize',resize);
  addEventListener('click',generate);
  let shapes=[];
  function generate(){
    shapes=[];
    const colors=['#000','#ff0000','#fff'];
    for(let i=0;i<12;i++){
      shapes.push({
        x:Math.random()*w,y:Math.random()*h,
        size:30+Math.random()*120,
        type:Math.floor(Math.random()*3),
        color:colors[Math.floor(Math.random()*colors.length)],
        rot:Math.random()*Math.PI,
        rotSpeed:(Math.random()-.5)*.02,
        vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5
      });
    }
  }
  function draw(){
    ctx.fillStyle='#f0f0f0';ctx.fillRect(0,0,w,h);
    shapes.forEach(s=>{
      s.x+=s.vx;s.y+=s.vy;s.rot+=s.rotSpeed;
      if(s.x<0||s.x>w)s.vx*=-1;if(s.y<0||s.y>h)s.vy*=-1;
      ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);
      ctx.fillStyle=s.color;ctx.strokeStyle='#000';ctx.lineWidth=2;
      if(s.type===0){ctx.fillRect(-s.size/2,-s.size/2,s.size,s.size);ctx.strokeRect(-s.size/2,-s.size/2,s.size,s.size)}
      else if(s.type===1){ctx.beginPath();ctx.arc(0,0,s.size/2,0,Math.PI*2);ctx.fill();ctx.stroke()}
      else{ctx.beginPath();ctx.moveTo(0,-s.size/2);ctx.lineTo(s.size/2,s.size/2);ctx.lineTo(-s.size/2,s.size/2);ctx.closePath();ctx.fill();ctx.stroke()}
      ctx.restore();
    });
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
