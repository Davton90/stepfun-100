<!-- Design: Biopunk Organism | Unique approach: bio-green/purple cell-like structures pulsing -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biopunk Organism</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Share Tech Mono',monospace;background:#0a1a0a;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
  canvas{display:block;position:absolute;inset:0}
  .title{position:absolute;top:30px;width:100%;text-align:center;font-size:1.8rem;z-index:2;color:#00ff88;letter-spacing:.3em;text-shadow:0 0 15px #00ff88}
  .hint{position:absolute;bottom:30px;font-size:.8rem;z-index:2;color:#8800ff;letter-spacing:.2em}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('083')" style="position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<canvas id="c"></canvas>
<div class="title">ORGANISM_01</div>
<div class="hint">click to feed</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h,mouse={x:-9999,y:-9999};
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
  resize();addEventListener('resize',resize);
  addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
  addEventListener('click',e=>cells.push(new Cell(e.clientX,e.clientY)));
  class Cell{
    constructor(x,y){this.x=x;this.y=y;this.r=0;this.targetR=20+Math.random()*40;this.vx=(Math.random()-.5)*.5;this.vy=(Math.random()-.5)*.5;this.hue=Math.random()>.5?120:280}
    update(){this.x+=this.vx;this.y+=this.vy;this.r+=(this.targetR-this.r)*.05;if(this.x<this.r||this.x>w-this.r)this.vx*=-1;if(this.y<this.r||this.y>h-this.r)this.vy*=-1}
    draw(){
      const grad=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r);
      grad.addColorStop(0,`hsla(${this.hue},100%,60%,.6)`);grad.addColorStop(1,`hsla(${this.hue},100%,40%,.1)`);
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=`hsla(${this.hue},100%,50%,.8)`;ctx.lineWidth=2;ctx.stroke();
    }
  }
  let cells=Array.from({length:8},()=>new Cell(w/2+Math.random()*100-50,h/2+Math.random()*100-50));
  function loop(){
    ctx.fillStyle='rgba(10,26,10,.08)';ctx.fillRect(0,0,w,h);
    cells.forEach(c=>{c.update();c.draw()});
    requestAnimationFrame(loop);
  }
  loop();
</script>

<script>
  window.toggleFavorite=function(id){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function setFavs(favs){try{localStorage.setItem(FAVORITES_KEY,JSON.stringify(favs))}catch(e){return}}
    let favs=getFavs();
    if(favs.includes(id)){favs=favs.filter(f=>f!==id);btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}
    else{favs.push(id);btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}
    setFavs(favs);
    window.dispatchEvent(new StorageEvent('storage',{key:FAVORITES_KEY}));
  };
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    const id='083';
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes(id)){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
