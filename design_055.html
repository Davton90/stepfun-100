<!-- Design: Neo-Brutal Raw | Unique approach: raw borders, clashing colors, click glitch -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neo-Brutal Raw</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Space Mono',monospace;background:#fff;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:20px;padding:20px}
  .box{width:200px;height:200px;border:4px solid #000;padding:20px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;cursor:pointer;transition:transform .1s}
  .box:active{transform:translate(4px,4px)}
  .box:nth-child(1){background:#ff0080;color:#fff}
  .box:nth-child(2){background:#00ffff;color:#000}
  .box:nth-child(3){background:#ffff00;color:#000}
  .box:nth-child(4){background:#ff8800;color:#000}
  .box:nth-child(5){background:#8800ff;color:#fff}
  .box:nth-child(6){background:#00ff00;color:#000}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('$id')">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<div class="box">BRUTAL</div>
<div class="box">RAW</div>
<div class="box">BOLD</div>
<div class="box">HONEST</div>
<div class="box">LOUD</div>
<div class="box">PROVOCATIVE</div>
<script>
  document.querySelectorAll('.box').forEach(box=>{
    box.addEventListener('click',()=>{
      box.style.transform=`translate(${Math.random()*10-5}px,${Math.random()*10-5}px)`;
      box.style.background=['#ff0080','#00ffff','#ffff00','#ff8800','#8800ff','#00ff00'][Math.floor(Math.random()*6)];
    });
  });
</script>
<script>
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes('$id')){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
