<!-- Design: Weather Widget | Unique approach: animated weather icons with day/night cycle -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#4a90e2,#87ceeb);overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;transition:background 2s}
  body.night{background:linear-gradient(135deg,#1a1a3e,#2d2d5a)}
  .card{background:rgba(255,255,255,.2);backdrop-filter:blur(10px);padding:30px 50px;border-radius:20px;text-align:center;color:#fff;box-shadow:0 8px 32px rgba(0,0,0,.1);transition:all .5s}
  .temp{font-size:4rem;font-weight:300;line-height:1}
  .condition{font-size:1.2rem;margin-top:10px;font-weight:600;letter-spacing:.1em}
  .details{display:flex;gap:30px;margin-top:20px;font-size:.85rem;opacity:.8}
  .icon{font-size:3rem;margin-bottom:15px}
  .toggle{margin-top:20px;padding:8px 20px;background:rgba(255,255,255,.3);border:none;color:#fff;font-family:inherit;border-radius:10px;cursor:pointer}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('042')" style="position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<div class="card">
  <div class="icon" id="icon">â˜€ï¸</div>
  <div class="temp">24Â°</div>
  <div class="condition" id="condition">SUNNY</div>
  <div class="details"><span>ðŸ’§ 45%</span><span>ðŸŒ¬ï¸ 12km/h</span><span>ðŸ“ Jakarta</span></div>
  <button class="toggle" onclick="toggleWeather()">Toggle Day/Night</button>
</div>
<script>
  const icons={sunny:'â˜€ï¸',cloudy:'â˜ï¸',rainy:'ðŸŒ§ï¸',night:'ðŸŒ™'};
  const conditions={sunny:'SUNNY',cloudy:'CLOUDY',rainy:'RAINY',night:'CLEAR NIGHT'};
  const states=['sunny','cloudy','rainy'];
  let current=0;
  function toggleWeather(){
    document.body.classList.toggle('night');
    const isNight=document.body.classList.contains('night');
    document.getElementById('icon').textContent=isNight?icons.night:icons[states[current]];
    document.getElementById('condition').textContent=isNight?conditions.night:conditions[states[current]];
  }
  setInterval(()=>{
    if(!document.body.classList.contains('night')){current=(current+1)%states.length;document.getElementById('icon').textContent=icons[states[current]];document.getElementById('condition').textContent=conditions[states[current]]}
  },5000);
</script>

<script>
  window.toggleFavorite=function(id){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function setFavs(favs){try{localStorage.setItem(FAVORITES_KEY,JSON.stringify(favs))}catch(e){return}}
    let favs=getFavs();
    if(favs.includes(id)){favs=favs.filter(f=>f!==id);btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}
    else{favs.push(id);btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}
    setFavs(favs);
    window.dispatchEvent(new StorageEvent('storage',{key:FAVORITES_KEY}));
  };
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    const id='042';
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes(id)){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
