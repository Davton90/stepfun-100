<!-- Design: Arcade Cabinet UI | Unique approach: neon borders with attract mode animation -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade Cabinet UI</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Press Start 2P',cursive;background:#111;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}
  .cabinet{width:400px;background:#1a1a1a;border:4px solid #ff0080;border-radius:20px;padding:30px;position:relative;box-shadow:0 0 40px rgba(255,0,128,.3),inset 0 0 20px rgba(255,0,128,.1)}
  .screen{background:#000;border:3px solid #333;border-radius:10px;padding:20px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:20px;position:relative;overflow:hidden}
  .screen::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.2) 2px,rgba(0,0,0,.2) 4px);pointer-events:none}
  .title{font-size:1.2rem;color:#ff0080;text-shadow:0 0 10px #ff0080;animation:pulse 1.5s ease-in-out infinite;text-align:center}
  .subtitle{font-size:.6rem;color:#00ffff;margin-top:15px;text-shadow:0 0 5px #00ffff;animation:blink 1s step-end infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  @keyframes blink{50%{opacity:0}}
  .btn-row{display:flex;gap:15px;justify-content:center}
  .btn{padding:12px 24px;border:2px solid;font-family:inherit;font-size:.6rem;cursor:pointer;background:transparent;color:#ff0080;border-color:#ff0080;transition:all .1s}
  .btn:hover{background:#ff0080;color:#000}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('025')" style="position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<div class="cabinet">
  <div class="screen">
    <div class="title">NEON RACER</div>
    <div class="subtitle">INSERT COIN TO PLAY</div>
  </div>
  <div class="btn-row">
    <button class="btn" onclick="this.style.boxShadow='0 0 20px #ff0080'">START</button>
    <button class="btn" onclick="this.style.boxShadow='0 0 20px #00ffff'">CREDITS</button>
  </div>
</div>
<script>
  const screen=document.querySelector('.screen');
  let credits=0;
  document.querySelectorAll('.btn')[0].addEventListener('click',()=>{
    if(credits>0){screen.querySelector('.title').textContent='NEON RACER';screen.querySelector('.subtitle').textContent='GO! GO! GO!'}
    else{alert('INSERT COIN FIRST')}
  });
  document.querySelectorAll('.btn')[1].addEventListener('click',()=>{
    credits++;screen.querySelector('.subtitle').textContent=`CREDITS: ${credits}`;
    setTimeout(()=>{screen.querySelector('.subtitle').textContent='INSERT COIN TO PLAY'},2000);
  });
</script>

<script>
  window.toggleFavorite=function(id){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function setFavs(favs){try{localStorage.setItem(FAVORITES_KEY,JSON.stringify(favs))}catch(e){return}}
    let favs=getFavs();
    if(favs.includes(id)){favs=favs.filter(f=>f!==id);btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}
    else{favs.push(id);btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}
    setFavs(favs);
    window.dispatchEvent(new StorageEvent('storage',{key:FAVORITES_KEY}));
  };
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    const id='025';
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes(id)){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
