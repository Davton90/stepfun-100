<!-- Design: Glitch Art Digital | Unique approach: RGB split, data moshing, mouse intensifies glitch -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glitch Art Digital</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'VT323',monospace;background:#000;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}
  canvas{display:block;position:absolute;inset:0}
  .title{position:absolute;top:30px;width:100%;text-align:center;font-size:2rem;z-index:2;color:#fff;text-shadow:2px 0 #ff0000,-2px 0 #00ffff;animation:glitch .2s infinite}
  @keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-3px,3px)}50%{transform:translate(3px,-3px)}75%{transform:translate(-2px,2px)}100%{transform:translate(0)}}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('071')" style="position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<canvas id="c"></canvas>
<div class="title">GLITCH_CORE</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h,mouseSpeed=0,lastX=0,lastY=0;
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
  resize();addEventListener('resize',resize);
  addEventListener('mousemove',e=>{const dx=e.clientX-lastX,dy=e.clientY-lastY;mouseSpeed=Math.hypot(dx,dy);lastX=e.clientX;lastY=e.clientY});
  function draw(){
    // Base image
    ctx.fillStyle='#111';ctx.fillRect(0,0,w,h);
    for(let i=0;i<5;i++){
      const hue=(Date.now()*.1+i*50)%360;
      ctx.fillStyle=`hsl(${hue},100%,50%)`;
      ctx.fillRect(w/2-100+i*50,h/2-50,100,100);
    }
    // Glitch
    const intensity=Math.min(1,mouseSpeed/50+Math.random()*.1);
    if(Math.random()<.3){
      const y=Math.random()*h;const h2=5+Math.random()*30;const offset=(Math.random()-.5)*100*intensity;
      const img=ctx.getImageData(0,y,w,h2);ctx.putImageData(img,offset,y);
    }
    if(Math.random()<.2){
      ctx.globalCompositeOperation='screen';ctx.fillStyle=`rgba(255,0,0,${intensity*.2})`;ctx.fillRect(3,0,w,h);
      ctx.fillStyle=`rgba(0,0,255,${intensity*.2})`;ctx.fillRect(-3,0,w,h);ctx.globalCompositeOperation='source-over';
    }
    // Noise
    if(Math.random()<.1){
      const id=ctx.getImageData(0,0,w,h);const d=id.data;
      for(let i=0;i<d.length;i+=40)d[i]=255-d[i];
      ctx.putImageData(id,0,0);
    }
    mouseSpeed*=.9;requestAnimationFrame(draw);
  }
  draw();
</script>

<script>
  window.toggleFavorite=function(id){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function setFavs(favs){try{localStorage.setItem(FAVORITES_KEY,JSON.stringify(favs))}catch(e){return}}
    let favs=getFavs();
    if(favs.includes(id)){favs=favs.filter(f=>f!==id);btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}
    else{favs.push(id);btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}
    setFavs(favs);
    window.dispatchEvent(new StorageEvent('storage',{key:FAVORITES_KEY}));
  };
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    const id='071';
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes(id)){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
