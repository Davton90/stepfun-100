<!-- Design: Post-Punk Club | Unique approach: black/red/white angular shapes pulsing with beat -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post-Punk Club</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Oswald',sans-serif;background:#000;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
  canvas{display:block;position:absolute;inset:0}
  .title{position:absolute;top:30px;width:100%;text-align:center;font-size:2.5rem;font-weight:700;z-index:2;color:#fff;letter-spacing:.5em;text-shadow:0 0 20px rgba(255,255,255,.3)}
  .beat{position:absolute;bottom:30px;font-size:1rem;z-index:2;color:#ff0000;letter-spacing:.3em;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
</style>
</head>
<body><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<canvas id="c"></canvas>
<div class="title">UNDERGROUND</div>
<div class="beat">120 BPM</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h;
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
  resize();addEventListener('resize',resize);
  let t=0;
  function draw(){
    t+=.05;
    ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
    const beat=Math.sin(t*4)*.5+.5;
    for(let i=0;i<8;i++){
      const x=w/2+Math.cos(t+i)*100;
      const y=h/2+Math.sin(t+i*1.3)*80;
      const size=30+beat*30+i*10;
      ctx.save();ctx.translate(x,y);ctx.rotate(t+i);
      ctx.strokeStyle=i%2?'#ff0000':'#fff';ctx.lineWidth=3;
      ctx.strokeRect(-size/2,-size/2,size,size);
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
