<!-- Design: Dungeon Synth Cave | Unique approach: pixel dungeon with flickering torch -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dungeon Synth Cave</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Press Start 2P',cursive;background:#0a0a0a;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
  canvas{display:block;image-rendering:pixelated;border:4px solid #333}
  .hud{display:flex;gap:30px;margin-top:15px;color:#8b4513;font-size:.6rem;z-index:2}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('$id')">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<canvas id="c" width="240" height="180"></canvas>
<div class="hud"><div>TORCH: <span id="torch">100%</span></div><div>DEPTH: <span id="depth">1</span></div></div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  const W=240,H=180;
  const palette=['#0a0a0a','#1a0f0a','#3e2723','#8b4513','#d4a574'];
  let torch=100,depth=1;
  function draw(){
    const flicker=Math.random()*20-10;
    // Cave
    ctx.fillStyle=palette[1];ctx.fillRect(0,0,W,H);
    // Walls
    ctx.fillStyle=palette[2];
    for(let x=0;x<W;x+=20){
      const h=30+Math.sin(x*.05+depth)*10;
      ctx.fillRect(x,H-h,20,h);
    }
    // Torch
    ctx.fillStyle=palette[3];ctx.fillRect(W/2-5,H-40,10,30);
    ctx.fillStyle=`rgba(255,200,100,${torch/100})`;
    ctx.beginPath();ctx.arc(W/2,H-50,15+flicker,0,Math.PI*2);ctx.fill();
    // Darkness overlay
    const grad=ctx.createRadialGradient(W/2,H-50,20,W/2,H/2,W/2);
    grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(1,`rgba(0,0,0,${1-torch/100})`);
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
    torch=Math.max(0,torch-.01);
    document.getElementById('torch').textContent=Math.floor(torch)+'%';
  }
  function loop(){draw();requestAnimationFrame(loop)}
  loop();
</script>
<script>
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes('$id')){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
