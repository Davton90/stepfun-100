<!-- Design: Wind Simulation | Unique approach: grass/leaf bending with periodic gusts -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wind Simulation</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Nunito',sans-serif;background:#87ceeb;overflow:hidden;height:100vh;display:flex;align-items:flex-end;justify-content:center}
  canvas{display:block;position:absolute;inset:0}
  .title{position:absolute;top:30px;width:100%;text-align:center;font-size:2rem;font-weight:300;color:#fff;z-index:2;text-shadow:0 2px 10px rgba(0,0,0,.2)}
  .hint{position:absolute;bottom:30px;font-size:.9rem;color:rgba(255,255,255,.7);z-index:2}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('$id')">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<canvas id="c"></canvas>
<div class="title">Wind in the Grass</div>
<div class="hint">move mouse to create wind</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h,mouse={x:-9999,y:-9999};
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
  resize();addEventListener('resize',resize);
  addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
  class Blade{
    constructor(x){this.x=x;this.y=h;this.height=40+Math.random()*60;this.phase=Math.random()*Math.PI*2;this.color=`hsl(${90+Math.random()*30},${50+Math.random()*30}%,${30+Math.random()*20}%)`}
    update(wind){
      this.phase+=.03;
      const windForce=Math.sin(this.phase)*wind;
      const bend=windForce*30;
      return{bend,height:this.height};
    }
    draw(bend,height){
      ctx.strokeStyle=this.color;ctx.lineWidth=2;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(this.x,this.y);
      ctx.quadraticCurveTo(this.x+Math.sin(this.phase)*20,this.y-height*.6,this.x+bend,this.y-height);
      ctx.stroke();
    }
  }
  let blades=[];
  for(let i=0;i<100;i++)blades.push(new Blade(i*(w/100)));
  let wind=0;
  function loop(){
    // Sky
    const grad=ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,'#87ceeb');grad.addColorStop(1,'#e0f0ff');
    ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
    // Wind from mouse
    let windForce=0;
    if(mouse.x>0){windForce=Math.max(0,(mouse.x/w-.5)*2)}
    wind+=(windForce-wind)*.05;
    // Random gusts
    wind+=Math.sin(Date.now()*.001)*.1;
    // Ground
    ctx.fillStyle='#4a7c3f';ctx.fillRect(0,h-10,w,10);
    // Draw blades
    blades.forEach(b=>{const{bend,height}=b.update(wind);b.draw(bend,height)});
    requestAnimationFrame(loop);
  }
  loop();
</script>
<script>
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes('$id')){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
