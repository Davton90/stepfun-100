<!-- Design: Conceptual Word Art | Unique approach: text as only visual forming shapes -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conceptual Word Art</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#000;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
  .word{font-size:1rem;font-weight:200;position:absolute;opacity:.8;transition:all 1s ease;white-space:nowrap;letter-spacing:.2em}
  .title{position:absolute;top:30px;width:100%;text-align:center;font-size:1rem;z-index:2;opacity:.3;letter-spacing:.5em}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('$id')">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<div class="title">WORD AS FORM</div>
<script>
  const words=['LOVE','HATE','PEACE','WAR','LIGHT','DARK','LIFE','DEATH','HOPE','FEAR','JOY','PAIN'];
  const colors=['#ff0080','#00ffff','#ffff00','#ff8800','#00ff00','#8800ff'];
  const container=document.body;
  words.forEach((word,i)=>{
    const el=document.createElement('div');el.className='word';
    el.textContent=word;
    el.style.color=colors[i%colors.length];
    el.style.left=Math.random()*80+'%';
    el.style.top=Math.random()*80+'%';
    el.style.fontSize=(10+Math.random()*30)+'px';
    el.style.fontWeight=Math.random()>.5?'900':'200';
    container.appendChild(el);
  });
  document.addEventListener('mousemove',e=>{
    document.querySelectorAll('.word').forEach(el=>{
      const dx=e.clientX-parseFloat(el.style.left);
      const dy=e.clientY-parseFloat(el.style.top);
      el.style.transform=`translate(${dx*.02}px,${dy*.02}px)`;
      el.style.opacity=.3+Math.abs(Math.sin(Date.now()*.001+parseFloat(el.style.left)))*.7;
    });
  });
</script>
<script>
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes('$id')){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
