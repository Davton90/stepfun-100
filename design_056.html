<!-- Design: Constructivist Propaganda | Unique approach: diagonal lines, bold shapes, click changes message -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constructivist Propaganda</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Oswald',sans-serif;background:#f5f0e8;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .poster{position:relative;width:90vmin;height:90vmin;max-width:600px;max-height:600px;background:#d4a574;border:8px solid #000;overflow:hidden;cursor:pointer}
  .diagonal{position:absolute;background:#000;transform:rotate(-45deg)}
  .diagonal:nth-child(1){width:200%;height:60px;top:30%;left:-50%}
  .diagonal:nth-child(2){width:200%;height:40px;top:60%;left:-50%}
  .circle{position:absolute;width:150px;height:150px;background:#ff0000;border-radius:50%;top:20%;right:10%;border:4px solid #000}
  .text{position:absolute;top:40%;left:10%;font-size:3rem;font-weight:700;color:#000;z-index:2;text-transform:uppercase;line-height:1.1;mix-blend-mode:multiply}
  .subtitle{position:absolute;bottom:15%;right:10%;font-family:'Inter',sans-serif;font-size:1rem;font-weight:900;color:#fff;background:#000;padding:5px 15px;transform:rotate(-5deg)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('056')" style="position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<div class="poster" id="poster">
  <div class="diagonal"></div>
  <div class="diagonal"></div>
  <div class="circle"></div>
  <div class="text" id="text">WORKERS<br>UNITE</div>
  <div class="subtitle">PROPAGANDA</div>
</div>
<script>
  const messages=['WORKERS UNITE','SOLIDARITY','REVOLUTION','POWER','RESIST','FREEDOM'];
  document.getElementById('poster').addEventListener('click',()=>{
    const msg=messages[Math.floor(Math.random()*messages.length)];
    document.getElementById('text').innerHTML=msg.replace(' ','<br>');
  });
</script>

<script>
  window.toggleFavorite=function(id){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function setFavs(favs){try{localStorage.setItem(FAVORITES_KEY,JSON.stringify(favs))}catch(e){return}}
    let favs=getFavs();
    if(favs.includes(id)){favs=favs.filter(f=>f!==id);btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}
    else{favs.push(id);btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}
    setFavs(favs);
    window.dispatchEvent(new StorageEvent('storage',{key:FAVORITES_KEY}));
  };
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    const id='056';
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes(id)){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
