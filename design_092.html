<!-- Design: Mystical Sigils | Unique approach: glowing runes pulsing with mouse trace -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystical Sigils</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Cinzel Decorative',serif;background:#0a001a;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
  canvas{display:block;position:absolute;inset:0}
  .title{position:absolute;top:30px;width:100%;text-align:center;font-size:2rem;font-weight:700;z-index:2;color:#9b59b6;text-shadow:0 0 30px rgba(155,89,182,.7);letter-spacing:.5em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">SIGILS</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h,mouse={x:-9999,y:-9999};
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
  resize();addEventListener('resize',resize);
  addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
  const symbols=['ᚠ','ᚢ','ᚦ','ᚨ','ᚱ','ᚲ','ᚷ','ᚹ','ᚺ','ᚾ','ᛁ','ᛃ','ᛇ','ᛈ','ᛉ','ᛊ','ᛏ','ᛒ','ᛖ','ᛗ','ᛚ','ᛜ','ᛞ','ᛟ'];
  let runes=[];
  for(let i=0;i<15;i++)runes.push({x:Math.random()*w,y:Math.random()*h,char:symbols[Math.floor(Math.random()*symbols.length)],size:20+Math.random()*40,rot:Math.random()*Math.PI*2,alpha:.3+Math.random()*.5});
  function draw(){
    ctx.fillStyle='#0a001a';ctx.fillRect(0,0,w,h);
    runes.forEach(r=>{
      r.rot+=.005;r.alpha=.3+Math.sin(Date.now()*.001+r.x)*.3;
      ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);
      ctx.fillStyle=`rgba(155,89,182,${r.alpha})`;ctx.font=`${r.size}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(r.char,0,0);
      ctx.restore();
    });
    // Mouse glow
    if(mouse.x>0){
      const grad=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,100);
      grad.addColorStop(0,'rgba(155,89,182,.2)');grad.addColorStop(1,'rgba(155,89,182,0)');
      ctx.fillStyle=grad;ctx.fillRect(mouse.x-100,mouse.y-100,200,200);
    }
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
