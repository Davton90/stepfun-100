<!-- Design: Black Metal Forest | Unique approach: black/white/forest green with blackletter and fog -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Metal Forest</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'UnifrakturMaguntia',cursive;background:#000;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
  canvas{display:block;position:absolute;inset:0}
  .title{position:absolute;top:30px;width:100%;text-align:center;font-size:3rem;z-index:2;color:#fff;text-shadow:0 0 20px rgba(255,255,255,.5);letter-spacing:.3em}
  .subtitle{position:absolute;bottom:30px;font-size:.8rem;z-index:2;color:#2d5a2d;letter-spacing:.3em}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
</style>
</head>
<body><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<canvas id="c"></canvas>
<div class="title">FROST</div>
<div class="subtitle">in the eternal forest</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h,mouse={x:-9999,y:-9999};
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
  resize();addEventListener('resize',resize);
  addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
  const trees=Array.from({length:20},(_,i)=>({x:i*(w/20),h:100+Math.random()*200,w:10+Math.random()*20}));
  function draw(){
    ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
    // Moon
    ctx.fillStyle='#fff';ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(w*.8,80,40,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    // Trees
    trees.forEach(t=>{
      ctx.fillStyle='#0a1a0a';ctx.fillRect(t.x-2,h,4,h);
      ctx.fillStyle='#1a3a1a';ctx.beginPath();ctx.moveTo(t.x,h);ctx.lineTo(t.x-t.w/2,h-t.h);ctx.lineTo(t.x+t.w/2,h-t.h);ctx.closePath();ctx.fill();
    });
    // Fog
    const fogGrad=ctx.createLinearGradient(0,h*.5,0,h);
    fogGrad.addColorStop(0,'rgba(200,200,200,0)');fogGrad.addColorStop(1,`rgba(200,200,200,${.1+Math.sin(Date.now()*.001)*.05})`);
    ctx.fillStyle=fogGrad;ctx.fillRect(0,0,w,h);
    // Mouse fog
    if(mouse.x>0){
      const grad=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,150);
      grad.addColorStop(0,'rgba(200,200,200,.2)');grad.addColorStop(1,'rgba(200,200,200,0)');
      ctx.fillStyle=grad;ctx.fillRect(mouse.x-150,mouse.y-150,300,300);
    }
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
