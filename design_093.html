<!-- Design: Horror Gothic | Unique approach: blood red/black with moving shadows -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horror Gothic</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Creepster',cursive;background:#0a0000;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
  canvas{display:block;position:absolute;inset:0}
  .title{position:absolute;top:30px;width:100%;text-align:center;font-size:3rem;z-index:2;color:#ff0000;text-shadow:0 0 30px rgba(255,0,0,.8);letter-spacing:.3em}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('093')" style="position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<canvas id="c"></canvas>
<div class="title">NIGHTMARE</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h,mouse={x:-9999,y:-9999};
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
  resize();addEventListener('resize',resize);
  addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
  function draw(){
    ctx.fillStyle='#0a0000';ctx.fillRect(0,0,w,h);
    // Distorted face silhouette
    const cx=w/2+Math.sin(Date.now()*.001)*30;const cy=h/2+Math.cos(Date.now()*.0015)*20;
    ctx.fillStyle='#1a0000';
    ctx.beginPath();ctx.ellipse(cx,cy,100+Math.sin(Date.now()*.002)*10,120,0,0,Math.PI*2);ctx.fill();
    // Eyes
    ctx.fillStyle='#ff0000';ctx.shadowColor='#ff0000';ctx.shadowBlur=20;
    ctx.beginPath();ctx.arc(cx-30+Math.sin(Date.now()*.005)*5,cy-20,10+Math.sin(Date.now()*.01)*3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+30+Math.sin(Date.now()*.005)*5,cy-20,10+Math.sin(Date.now()*.01)*3,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // Mouth
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(cx,cy+40,30+Math.sin(Date.now()*.003)*5,15,0,0,Math.PI*2);ctx.fill();
    // Blood drip
    ctx.fillStyle='#8b0000';
    for(let i=0;i<5;i++){
      const x=cx-20+i*10;const drip=((Date.now()*.02+i*20)%60);
      ctx.fillRect(x,cy+50,3,drip);
    }
    // Shadows
    if(mouse.x>0){
      const grad=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,150);
      grad.addColorStop(0,'rgba(139,0,0,.2)');grad.addColorStop(1,'rgba(139,0,0,0)');
      ctx.fillStyle=grad;ctx.fillRect(mouse.x-150,mouse.y-150,300,300);
    }
    requestAnimationFrame(draw);
  }
  draw();
</script>

<script>
  window.toggleFavorite=function(id){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function setFavs(favs){try{localStorage.setItem(FAVORITES_KEY,JSON.stringify(favs))}catch(e){return}}
    let favs=getFavs();
    if(favs.includes(id)){favs=favs.filter(f=>f!==id);btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}
    else{favs.push(id);btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}
    setFavs(favs);
    window.dispatchEvent(new StorageEvent('storage',{key:FAVORITES_KEY}));
  };
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    const id='093';
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes(id)){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
