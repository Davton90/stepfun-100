<!-- Design: Synthwave Sunset | Unique approach: pink/purple/orange retro sun with slow set -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synthwave Sunset</title>
<link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Monoton',cursive;background:#0a0a2a;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
  canvas{display:block;position:absolute;inset:0}
  .title{position:absolute;top:40px;width:100%;text-align:center;font-size:2.5rem;z-index:2;color:#ff0080;text-shadow:0 0 30px #ff0080;letter-spacing:.3em}
  .hint{position:absolute;bottom:40px;font-size:.8rem;z-index:2;color:#00ffff;letter-spacing:.2em}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
</style>
</head>
<body><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<canvas id="c"></canvas>
<div class="title">OUTRUN</div>
<div class="hint">move mouse to change time</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h,mouse={x:.5,y:.5};
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
  resize();addEventListener('resize',resize);
  addEventListener('mousemove',e=>{mouse.x=e.clientX/w;mouse.y=e.clientY/h});
  let offset=0;
  function draw(){
    offset+=.5;
    // Sky gradient
    const skyY=h*(.3+mouse.y*.2);
    const sky=ctx.createLinearGradient(0,0,0,skyY);
    sky.addColorStop(0,'#0a0a2a');sky.addColorStop(.5,'#2d1b4e');sky.addColorStop(1,'#ff0080');
    ctx.fillStyle=sky;ctx.fillRect(0,0,w,skyY);
    // Sun
    const sunY=skyY-50-mouse.y*50;
    const sun=ctx.createLinearGradient(0,sunY-80,0,sunY+80);
    sun.addColorStop(0,'#ffff00');sun.addColorStop(.5,'#ff8800');sun.addColorStop(1,'#ff0080');
    ctx.fillStyle=sun;ctx.beginPath();ctx.arc(w/2,sunY,80,0,Math.PI*2);ctx.fill();
    // Sun stripes
    ctx.fillStyle='#0a0a2a';
    for(let i=0;i<6;i++){ctx.fillRect(w/2-80,sunY-40+i*15,160,7)}
    // Grid
    ctx.strokeStyle='#ff0080';ctx.lineWidth=2;ctx.globalAlpha=.6;
    const horizon=skyY+20;
    for(let i=0;i<20;i++){
      const y=horizon+i*30;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
    }
    for(let i=-10;i<=10;i++){
      const x=w/2+i*80;ctx.beginPath();ctx.moveTo(w/2,horizon);ctx.lineTo(x,h);ctx.stroke();
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
