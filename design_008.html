<!-- Design: Cyberpunk Neon Rain | Unique approach: neon symbol rain with mouse acceleration -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyberpunk Neon Rain</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Share Tech Mono',monospace;background:#000;overflow:hidden;height:100vh;color:#0f0}
  canvas{display:block;position:absolute;inset:0}
  .title{position:absolute;top:30px;left:30px;font-size:1.4rem;z-index:2;color:#ff00de;text-shadow:0 0 15px #ff00de;letter-spacing:.3em}
  .hud{position:absolute;bottom:20px;left:20px;right:20px;display:flex;justify-content:space-between;font-size:.7rem;color:#01cdfe;z-index:2;opacity:.7}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('$id')">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<canvas id="c"></canvas>
<div class="title">NEON RAIN</div>
<div class="hud"><span>SYS://NEON</span><span id="fps">FPS:60</span><span>NET://CONNECTED</span></div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h,mouseSpeed=0,lastX=0,lastY=0;
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
  resize();addEventListener('resize',resize);
  addEventListener('mousemove',e=>{const dx=e.clientX-lastX,dy=e.clientY-lastY;mouseSpeed=Math.hypot(dx,dy);lastX=e.clientX;lastY=e.clientY});
  const symbols='ã‚¢ã‚¤ã‚¦ã‚¨ã‚ªã‚«ã‚­ã‚¯ã‚±ã‚³ã‚µã‚·ã‚¹ã‚»ã‚½ã‚¿ãƒãƒ„ãƒ†ãƒˆãƒŠãƒ‹ãƒŒãƒãƒŽãƒãƒ’ãƒ•ãƒ˜ãƒ›ãƒžãƒŸãƒ ãƒ¡ãƒ¢ãƒ¤ãƒ¦ãƒ¨ãƒ©ãƒªãƒ«ãƒ¬ãƒ­ãƒ¯ãƒ²ãƒ³0123456789';
  const columns=Array.from({length:40},()=>({x:Math.random()*w,y:Math.random()*-h,speed:2+Math.random()*4,chars:Array.from({length:20},()=>symbols[Math.floor(Math.random()*symbols.length)])}));
  function draw(){
    ctx.fillStyle='rgba(0,0,0,.08)';ctx.fillRect(0,0,w,h);
    ctx.font='14px monospace';
    columns.forEach(col=>{
      col.y+=col.speed+mouseSpeed*.2;
      if(col.y>h){col.y=-200;col.x=Math.random()*w;col.speed=2+Math.random()*4}
      const hue=Math.random()>.5?300:180;
      ctx.fillStyle=`hsl(${hue},100%,60%)`;
      col.chars.forEach((ch,i)=>{
        const y=col.y+i*18;
        if(y>0&&y<h)ctx.fillText(ch,col.x,y);
      });
    });
    mouseSpeed*=.95;
    requestAnimationFrame(draw);
  }
  draw();
</script>
<script>
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes('$id')){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
