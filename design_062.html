<!-- Design: Dadaist Collage | Unique approach: random found objects, text, chaotic arrangement -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dadaist Collage</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Bangers&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f5f0e8;overflow:hidden;height:100vh;position:relative}
  .item{position:absolute;border:2px solid #000;padding:10px;font-size:.8rem;cursor:pointer;transition:transform .2s}
  .item:active{transform:scale(1.1) rotate(5deg)}
  .item:nth-child(1){top:10%;left:5%;background:#ff0080;color:#fff;font-family:'Bangers',sans-serif;font-size:2rem;transform:rotate(-5deg);padding:20px}
  .item:nth-child(2){top:30%;left:60%;background:#00ffff;font-family:'Special Elite',monospace;transform:rotate(3deg)}
  .item:nth-child(3){top:60%;left:20%;background:#ffff00;font-family:'Bangers',sans-serif;font-size:3rem;transform:rotate(-8deg)}
  .item:nth-child(4){top:15%;left:80%;background:#fff;font-size:1.5rem;transform:rotate(12deg);border-style:dashed}
  .item:nth-child(5){top:70%;left:70%;background:#ff8800;font-family:'Special Elite',monospace;transform:rotate(-3deg);padding:30px}
  .item:nth-child(6){top:45%;left:40%;background:#8800ff;color:#fff;font-family:'Bangers',sans-serif;font-size:2.5rem;transform:rotate(7deg)}
  .item:nth-child(7){top:80%;left:10%;background:#fff;border-width:4px;font-size:1.2rem;transform:rotate(-10deg)}
  .title{position:absolute;top:5%;left:50%;transform:translateX(-50%);font-size:1rem;color:#666;z-index:2;letter-spacing:.3em;font-family:sans-serif}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('062')" style="position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<div class="title">DADAIST COLLAGE â€” CLICK ITEMS TO MOVE</div>
<div class="item">ART IS DEAD</div>
<div class="item">Found object #42</div>
<div class="item">CHAOS</div>
<div class="item">Random text fragment 2024</div>
<div class="item">Anti-art manifesto</div>
<div class="item">DADA</div>
<div class="item">Meaningless beauty</div>
<script>
  let activeItem=null,startX=0,startY=0,startLeft=0,startTop=0;
  document.querySelectorAll('.item').forEach(item=>{
    item.addEventListener('mousedown',e=>{
      activeItem=item;startX=e.clientX;startY=e.clientY;
      startLeft=item.offsetLeft;startTop=item.offsetTop;item.style.zIndex=100;
    });
  });
  addEventListener('mousemove',e=>{
    if(activeItem){activeItem.style.left=startLeft+(e.clientX-startX)+'px';activeItem.style.top=startTop+(e.clientY-startY)+'px'}
  });
  addEventListener('mouseup',()=>{if(activeItem){activeItem.style.zIndex='';activeItem=null}});
</script>

<script>
  window.toggleFavorite=function(id){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function setFavs(favs){try{localStorage.setItem(FAVORITES_KEY,JSON.stringify(favs))}catch(e){return}}
    let favs=getFavs();
    if(favs.includes(id)){favs=favs.filter(f=>f!==id);btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}
    else{favs.push(id);btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}
    setFavs(favs);
    window.dispatchEvent(new StorageEvent('storage',{key:FAVORITES_KEY}));
  };
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    const id='062';
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes(id)){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
