<!-- Design: Flat Design Illustration | Unique approach: flat color parallax layers on mouse -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flat Design Illustration</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Nunito',sans-serif;background:#87ceeb;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .scene{position:relative;width:100%;height:100vh;overflow:hidden}
  .layer{position:absolute;width:120%;height:120%;left:-10%;top:-10%;transition:transform .1s ease-out}
  .sun{background:#ffeb3b;border-radius:50%;width:150px;height:150px;top:10%;left:70%}
  .mountain1{background:#6b8e23;top:50%;left:10%;clip-path:polygon(50% 0%,0% 100%,100% 100%)}
  .mountain2{background:#556b2f;top:55%;left:40%;clip-path:polygon(50% 0%,0% 100%,100% 100%);width:140%;height:140%}
  .mountain3{background:#2f4f4f;top:60%;left:20%;clip-path:polygon(50% 0%,0% 100%,100% 100%);width:130%;height:130%}
  .ground{background:#8fbc8f;top:75%;left:0;width:100%;height:100%}
  .tree{background:#228b22;width:60px;height:80px;top:55%;left:25%;clip-path:polygon(50% 0%,0% 100%,100% 100%)}
  .title{position:absolute;bottom:30px;width:100%;text-align:center;font-size:1.5rem;font-weight:700;color:#fff;z-index:2;text-shadow:2px 2px 0 rgba(0,0,0,.2)}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
</style>
</head>
<body><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<div class="scene" id="scene">
  <div class="layer sun" data-speed="0.02"></div>
  <div class="layer mountain1" data-speed="0.05"></div>
  <div class="layer mountain2" data-speed="0.08"></div>
  <div class="layer mountain3" data-speed="0.12"></div>
  <div class="layer ground" data-speed="0.15"></div>
  <div class="layer tree" data-speed="0.2"></div>
  <div class="title">FLAT LANDSCAPE</div>
</div>
<script>
  const scene=document.getElementById('scene');
  const layers=document.querySelectorAll('.layer');
  document.addEventListener('mousemove',e=>{
    const x=(e.clientX/window.innerWidth-.5)*2;
    const y=(e.clientY/window.innerHeight-.5)*2;
    layers.forEach(l=>{
      const speed=parseFloat(l.dataset.speed)||.1;
      l.style.transform=`translate(${x*speed*50}px,${y*speed*50}px)`;
    });
  });
</script>
</body>
</html>
