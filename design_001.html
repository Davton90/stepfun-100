<!-- Design: Bauhaus Geometric Stage | Unique approach: animated primary shapes on grid with mouse parallax -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bauhaus Geometric Stage</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Josefin Sans',sans-serif;background:#f5f5f5;overflow:hidden;height:100vh;color:#1D3557}
  .stage{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .title{font-size:3rem;font-weight:700;text-align:center;margin-bottom:20px;letter-spacing:.1em;z-index:2}
  .subtitle{font-size:1.2rem;opacity:.8;text-align:center;z-index:2}
  .shape{position:absolute;opacity:.8;transition:transform .3s ease-out}
  .circle{width:180px;height:180px;background:#E63946;border-radius:50%;top:15%;left:18%}
  .square{width:140px;height:140px;background:#1D3557;top:55%;right:20%}
  .triangle{width:0;height:0;border-left:100px solid transparent;border-right:100px solid transparent;border-bottom:173px solid #457B9D;bottom:18%;left:45%}
  .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px);background-size:40px 40px;z-index:0}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('$id')">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<div class="stage" id="stage">
  <div class="grid-bg"></div>
  <div class="shape circle" data-speed="0.03"></div>
  <div class="shape square" data-speed="0.05"></div>
  <div class="shape triangle" data-speed="0.04"></div>
  <div class="title">Bauhaus Geometric</div>
  <div class="subtitle">Form follows function</div>
</div>
<script>
  const stage=document.getElementById('stage');
  const shapes=document.querySelectorAll('.shape');
  document.addEventListener('mousemove',e=>{
    const x=(e.clientX/window.innerWidth-.5)*2;
    const y=(e.clientY/window.innerHeight-.5)*2;
    shapes.forEach(s=>{
      const speed=parseFloat(s.dataset.speed);
      const tx=x*speed*100;
      const ty=y*speed*100;
      s.style.transform=`translate(${tx}px,${ty}px)`;
    });
  });
</script>
<script>
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes('$id')){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
