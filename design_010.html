<!-- Design: Biophilic Living Canvas | Unique approach: root-like branching lines that grow and attract to mouse -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biophilic Living Canvas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#1b2a1b;overflow:hidden;height:100vh;color:#c8d5c0}
  canvas{display:block;position:absolute;inset:0}
  .title{position:absolute;top:30px;width:100%;text-align:center;font-size:2rem;font-weight:300;z-index:2;letter-spacing:.2em;color:#e8f0e8}
  .subtitle{position:absolute;bottom:30px;width:100%;text-align:center;font-size:.8rem;z-index:2;opacity:.6;letter-spacing:.3em;text-transform:uppercase}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('010')" style="position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<canvas id="c"></canvas>
<div class="title">LIVING ROOTS</div>
<div class="subtitle">move mouse to guide growth</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h,mouse={x:-9999,y:-9999};
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
  resize();addEventListener('resize',resize);
  addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
  class Root{
    constructor(x,y){this.x=x;this.y=y;this.angle=Math.random()*Math.PI*2;this.speed=.5+Math.random();this.life=200+Math.random()*200;this.maxLife=this.life;this.width=1+Math.random()*2;this.color=`hsl(${90+Math.random()*40},40%,${30+Math.random()*30}%)`;this.history=[]}
    update(){
      this.history.push({x:this.x,y:this.y});
      if(this.history.length>50)this.history.shift();
      const dx=mouse.x-this.x,dy=mouse.y-this.y,dist=Math.hypot(dx,dy);
      if(dist<200&&dist>0){this.angle=Math.atan2(dy,dx)+(Math.random()-.5)*.5}
      else{this.angle+=(Math.random()-.5)*.1}
      this.x+=Math.cos(this.angle)*this.speed;
      this.y+=Math.sin(this.angle)*this.speed;
      this.life--;
      if(Math.random()<.01&&this.life>50)this.branch();
    }
    branch(){
      if(roots.length>300)return;
      const r=new Root(this.x,this.y);
      r.angle=this.angle+(Math.random()-.5)*Math.PI*.5;
      r.life=this.life*.7;r.speed=this.speed*.8;r.width=this.width*.8;
      roots.push(r);
    }
    draw(){
      ctx.beginPath();
      ctx.moveTo(this.history[0]?.x??this.x,this.history[0]?.y??this.y);
      this.history.forEach(p=>ctx.lineTo(p.x,p.y));
      ctx.strokeStyle=this.color;ctx.lineWidth=this.width;ctx.globalAlpha=this.life/this.maxLife;ctx.stroke();ctx.globalAlpha=1;
    }
  }
  const roots=[];
  for(let i=0;i<5;i++)roots.push(new Root(w/2+(Math.random()-.5)*100,h/2+(Math.random()-.5)*100));
  function loop(){
    ctx.fillStyle='rgba(27,42,27,.05)';ctx.fillRect(0,0,w,h);
    roots.forEach(r=>{r.update();r.draw()});
    for(let i=roots.length-1;i>=0;i--)if(roots[i].life<=0)roots.splice(i,1);
    requestAnimationFrame(loop);
  }
  loop();
</script>

<script>
  window.toggleFavorite=function(id){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function setFavs(favs){try{localStorage.setItem(FAVORITES_KEY,JSON.stringify(favs))}catch(e){return}}
    let favs=getFavs();
    if(favs.includes(id)){favs=favs.filter(f=>f!==id);btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}
    else{favs.push(id);btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}
    setFavs(favs);
    window.dispatchEvent(new StorageEvent('storage',{key:FAVORITES_KEY}));
  };
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    const id='010';
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes(id)){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
