<!-- Design: Kinetic Typography | Unique approach: words animate with bounce, spin, scale -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinetic Typography</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Bebas Neue',sans-serif;background:#000;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}
  .stage{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
  .word{font-size:5rem;font-weight:900;color:#fff;opacity:0;animation:anim 3s ease-in-out infinite;text-shadow:0 0 30px currentColor}
  .word:nth-child(1){animation-delay:0s;color:#ff0080}
  .word:nth-child(2){animation-delay:.5s;color:#00ffff;font-size:6rem}
  .word:nth-child(3){animation-delay:1s;color:#ffff00}
  .word:nth-child(4){animation-delay:1.5s;color:#ff8800}
  .word:nth-child(5){animation-delay:2s;color:#88ff00;font-size:4rem}
  @keyframes anim{
    0%{opacity:0;transform:translateY(50px) rotateX(90deg) scale(.5)}
    20%{opacity:1;transform:translateY(0) rotateX(0) scale(1.2)}
    40%{transform:translateY(-10px) scale(1)}
    80%{opacity:1;transform:translateY(0) scale(1)}
    100%{opacity:0;transform:translateY(-30px) scale(.8)}
  }
  .hint{position:absolute;bottom:30px;font-size:.8rem;color:rgba(255,255,255,.3);font-family:'Inter',sans-serif;letter-spacing:.2em}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
</style>
</head>
<body><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<div class="stage">
  <div class="word">CREATIVE</div>
  <div class="word">KINETIC</div>
  <div class="word">TYPOGRAPHY</div>
  <div class="word">IN MOTION</div>
  <div class="word">DESIGN</div>
</div>
<div class="hint">click to restart animation</div>
<script>
  document.querySelectorAll('.word').forEach(w=>{w.style.animation='none';w.offsetHeight;w.style.animation=''});
  document.addEventListener('click',()=>document.querySelectorAll('.word').forEach(w=>{w.style.animation='none';w.offsetHeight;w.style.animation=''}));
</script>
</body>
</html>
