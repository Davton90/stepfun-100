<!-- Design: Solarpunk Verdant Dome | Unique approach: greenhouse dome with floating leaves and click-to-plant -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solarpunk Verdant Dome</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Cormorant Garamond',serif;background:linear-gradient(180deg,#87ceeb 0%,#98d8aa 50%,#5a8f3c 100%);overflow:hidden;height:100vh;color:#2d4a1c}
  canvas{display:block;position:absolute;inset:0}
  .title{position:absolute;top:30px;width:100%;text-align:center;font-size:2.5rem;font-style:italic;z-index:2;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.2)}
  .hint{position:absolute;bottom:30px;width:100%;text-align:center;font-size:.9rem;z-index:2;color:#fff;opacity:.8;font-style:italic}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
<style>
  .back-to-gallery{position:fixed;top:20px;left:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s}
  .back-to-gallery:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;background:rgba(0,0,0,.7);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .favorite-btn:hover{background:rgba(255,0,128,.8);transform:translateX(-5px)}
  .favorite-btn.is-favorite{background:rgba(255,0,128,.9);border-color:#ff0080}
</style>
</head>
<body><button class="favorite-btn" id="favBtn" onclick="toggleFavorite('$id')">☆ Add to Favorites</button><a href="index.html" class="back-to-gallery">&larr; Back to Gallery</a>
<canvas id="c"></canvas>
<div class="title">Verdant Dome</div>
<div class="hint">click anywhere to plant a leaf</div>
<script>
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let w,h;
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
  resize();addEventListener('resize',resize);
  addEventListener('click',e=>leaves.push(new Leaf(e.clientX,e.clientY)));
  class Leaf{
    constructor(x,y){this.x=x;this.y=y;this.size=0;this.targetSize=10+Math.random()*20;this.vx=(Math.random()-.5)*.5;this.vy=-1-Math.random()*2;this.life=1;this.rot=Math.random()*Math.PI*2;this.color=['#7cb342','#8bc34a','#9ccc65','#558b2f','#33691e'][Math.floor(Math.random()*5)]}
    update(){this.x+=this.vx+Math.sin(Date.now()*.001+this.y*.01)*.3;this.y+=this.vy;this.size+=(this.targetSize-this.size)*.05;this.rot+=.02;if(this.y<-50)this.life=0}
    draw(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.fillStyle=this.color;ctx.beginPath();ctx.ellipse(0,0,this.size,this.size*.5,0,0,Math.PI*2);ctx.fill();ctx.restore()}
  }
  let leaves=Array.from({length:30},()=>new Leaf(Math.random()*w,Math.random()*h));
  leaves.forEach(l=>l.size=l.targetSize);
  function loop(){
    ctx.fillStyle='rgba(135,206,235,.15)';ctx.fillRect(0,0,w,h);
    leaves=leaves.filter(l=>l.life>0);
    leaves.forEach(l=>{l.update();l.draw()});
    requestAnimationFrame(loop);
  }
  loop();
</script>
<script>
  (function(){
    const FAVORITES_KEY='stepfun_favorites';
    const btn=document.getElementById('favBtn');
    if(!btn)return;
    function getFavs(){try{const f=localStorage.getItem(FAVORITES_KEY);return f?JSON.parse(f):[]}catch(e){return[]}}
    function updateBtn(){const favs=getFavs();if(favs.includes('$id')){btn.textContent='★ Remove from Favorites';btn.classList.add('is-favorite')}else{btn.textContent='☆ Add to Favorites';btn.classList.remove('is-favorite')}}
    updateBtn();
    window.addEventListener('storage',updateBtn);
  })();
</script>
</body>
</html>
